name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zip
          fi
      - name: Smoke release archive
        run: |
          mkdir -p /tmp/pkudisk-sync-release-smoke
          archive=$(./scripts/build-release.sh linux/amd64 /tmp/pkudisk-sync-release-smoke)
          test -f "$archive"
          unzip -q "$archive" -d /tmp/pkudisk-sync-release-unpacked
          binary=$(find /tmp/pkudisk-sync-release-unpacked -type f -name pkudisk-sync -print -quit)
          "$binary" version | grep -Fx "pkudisk-sync $(./scripts/version.sh release)"

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./cmd/pkudisk-sync

  windows-service:
    name: Windows per-user service smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache: true
      - name: Build pkudisk-sync
        shell: pwsh
        run: go build -o pkudisk-sync.exe ./cmd/pkudisk-sync
      - name: Exercise Scheduled Task lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Sync {
            param([Parameter(ValueFromRemainingArguments = $true)][string[]] $Arguments)
            $output = & .\pkudisk-sync.exe @Arguments 2>&1
            $code = $LASTEXITCODE
            $output | Out-Host
            if ($code -ne 0) {
              throw "pkudisk-sync $($Arguments -join ' ') failed with exit code $code"
            }
            return $output
          }

          function Wait-SyncStatus {
            param([string] $Expected)
            $status = ''
            for ($i = 0; $i -lt 30; $i++) {
              $status = (Invoke-Sync service status | Out-String).Trim()
              if ($status -eq $Expected) {
                return
              }
              Start-Sleep -Milliseconds 500
            }
            throw "scheduled task did not reach $Expected state: $status"
          }

          $installed = $false
          try {
            Invoke-Sync service install | Out-Null
            $installed = $true
            Wait-SyncStatus 'inactive'
            Invoke-Sync service start | Out-Null
            Wait-SyncStatus 'active'
            Invoke-Sync service stop | Out-Null
            Wait-SyncStatus 'inactive'
            Invoke-Sync service uninstall | Out-Null
            $installed = $false
            Wait-SyncStatus 'not-installed'
          }
          finally {
            if ($installed) {
              & .\pkudisk-sync.exe service stop 2>&1 | Out-Host
              & .\pkudisk-sync.exe service uninstall 2>&1 | Out-Host
            }
          }
