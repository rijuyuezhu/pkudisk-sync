name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes zip
          fi
      - name: Smoke release archive
        run: |
          mkdir -p /tmp/pkudisk-sync-release-smoke
          archive=$(./scripts/build-release.sh linux/amd64 /tmp/pkudisk-sync-release-smoke)
          test -f "$archive"
          unzip -q "$archive" -d /tmp/pkudisk-sync-release-unpacked
          binary=$(find /tmp/pkudisk-sync-release-unpacked -type f -name pkudisk-sync -print -quit)
          "$binary" version | grep -Fx "pkudisk-sync $(./scripts/version.sh release)"

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./cmd/pkudisk-sync
